name: Deploy to Firebase Hosting on Workflow Dispatch
on:
  workflow_dispatch:
    inputs:
      channelId:
        required: true
        description: Name of channelId. If you set the live, action will deploy to production.
jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKASHIC_SCRAMBLE }}
          channelId: ${{ github.event.inputs.channelId }}
          projectId: akashic-scramble
